[project]
name = "pickerboi"
version = "0.1.0"
description = ""
authors = [
    {name = "Mina Kamel",email = "minallkamel@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.16"
dependencies = [
    "pyside6 (>=6.12.0,<7.0.0)",
    "emoji (>=2.16.0,<3.0.0)"
]

[tool.poetry]
packages = [{include = "pickerboi", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pylsp-mypy (>=0.8.2,<0.9.0)",
    "python-lsp-black (>=2.0.0,<3.0.0)",
    "python-lsp-server[all] (>=1.15.0,<2.0.0)"
]
